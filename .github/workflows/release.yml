name: "Publish Release"

on:
  push:
    tags:
      - 'v*' # Chạy khi bạn push một tag có định dạng v1.0.0, v0.1.0...

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: run go tests
        shell: pwsh
        run: |
          cd sidecar
          go test ./internal/git/ -v
          cd ..

      - name: build sidecar
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String "host:").ToString().Split(":")[1].Trim()
          cd sidecar
          go build -ldflags="-s -w" -o ../app/src-tauri/binaries/sidecar-$triple.exe .
          cd ..

      - name: install frontend dependencies
        run: |
          cd app
          npm install

      - uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Lazy Cherry Pick ${{ github.ref_name }}"
          releaseBody: |
            ## What's New
            See commit history for full details.

            ## Installation
            1. Download the `.msi` installer below.
            2. Run it (click "More info → Run anyway" if Windows SmartScreen warns you — the app is unsigned).
            3. **Prerequisite:** [Git for Windows](https://git-scm.com/downloads) must be installed.

            ## MCP server (AI tools, no install needed)
            Download `sidecar-x86_64-pc-windows-msvc.exe` below and run it with `--mcp` to use it as a standalone MCP server (Claude Desktop, Cursor, etc.) — the desktop app is not required. See [docs/MCP.md](https://github.com/${{ github.repository }}/blob/master/docs/MCP.md).
          releaseDraft: true
          prerelease: false

      - name: upload standalone sidecar binary (MCP server)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $triple = (rustc -vV | Select-String "host:").ToString().Split(":")[1].Trim()
          gh release upload "${{ github.ref_name }}" "app/src-tauri/binaries/sidecar-$triple.exe" --clobber --repo "${{ github.repository }}"

      - name: verify mcp-npm version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = node -p "require('./mcp-npm/package.json').version"
          if ($tag -ne $pkgVersion) {
            Write-Error "mcp-npm/package.json version ($pkgVersion) does not match tag ($tag) — bump it in the same release commit."
            exit 1
          }

      - name: inject sidecar checksum into mcp-npm/package.json
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String "host:").ToString().Split(":")[1].Trim()
          $hash = (Get-FileHash "app/src-tauri/binaries/sidecar-$triple.exe" -Algorithm SHA256).Hash.ToLower()
          $env:SIDECAR_SHA256 = $hash
          node -e "const fs=require('fs');const p='mcp-npm/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.sidecarSha256=process.env.SIDECAR_SHA256;fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');"

      - name: publish npm MCP wrapper (lazy-cherry-pick-mcp)
        shell: pwsh
        working-directory: mcp-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
